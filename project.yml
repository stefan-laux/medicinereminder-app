name: MedicineReminder

options:
  bundleIdPrefix: com.stefanlaux
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "54MYV55XF5"  # Apple Developer Team ID (Personal Team)
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad only
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  MedicineReminder:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: MedicineReminder
      - path: Shared
    dependencies:
      - target: MedicineReminderWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stefanlaux.medicinereminder
        PRODUCT_NAME: MedicineReminder
        INFOPLIST_KEY_CFBundleDisplayName: "Med Reminder"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
    info:
      path: MedicineReminder/Info.plist
      properties:
        CFBundleDisplayName: "Med Reminder"
        # An (empty) launch screen is REQUIRED for the app to use the full native
        # screen size — without it iOS renders the app letterboxed/scaled.
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ITSAppUsesNonExemptEncryption: false
        NSUserNotificationsUsageDescription: "MedicineReminder uses notifications to remind you when it's time to take your medicine."
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: MedicineReminder/MedicineReminder.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.stefanlaux.medicinereminder
        # --- iCloud sync (CloudKit) — PAID Apple Developer account required. ---
        # Uncomment these two keys HERE and on the widget target below, then run
        # `xcodegen generate`. A free Personal Team cannot sign the iCloud
        # entitlement, so leave them commented until you've enrolled. Also enable
        # "Push Notifications" in Xcode (CloudKit uses silent pushes to sync).
        # com.apple.developer.icloud-services:
        #   - CloudKit
        # com.apple.developer.icloud-container-identifiers:
        #   - iCloud.com.stefanlaux.medicinereminder

  MedicineReminderWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: MedicineReminderWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stefanlaux.medicinereminder.widgets
        PRODUCT_NAME: MedicineReminderWidgets
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
    info:
      path: MedicineReminderWidgets/Info.plist
      properties:
        CFBundleDisplayName: Medicine Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MedicineReminderWidgets/MedicineReminderWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.stefanlaux.medicinereminder
        # --- iCloud sync (CloudKit) — uncomment together with the app target. ---
        # com.apple.developer.icloud-services:
        #   - CloudKit
        # com.apple.developer.icloud-container-identifiers:
        #   - iCloud.com.stefanlaux.medicinereminder

# A single shared scheme that runs the app (the widget builds automatically as an
# embedded dependency). Defining it here means `xcodegen generate` always
# produces the MedicineReminder app scheme — and no standalone widget scheme to
# accidentally run (which triggers the _XCWidgetKind error).
schemes:
  MedicineReminder:
    build:
      targets:
        MedicineReminder: all
    run:
      config: Debug
    archive:
      config: Release
